name: Clutch Wallet
description: >-
  Clutch Wallet was a Los Angeles-based web3 startup building a non-custodial
  "social wallet" and web3 toolkit — a seedless browser extension and mobile
  wallet (leaning on account abstraction and seamless sign-in) paired with a
  dApp offering token search, three-click DeFi, a web3 social profile, a
  personalized crypto media feed, aggregated multi-wallet balances in a single
  dashboard, integrated crypto education, and community tools. Founded by Bec
  Jones (CEO), James Kouzinas (CFO/COO), and Sheela Vats (CTO), it raised ~$800K
  backed by Anthemis (Female Innovators Lab Fund), Emmeline Ventures, Everywhere
  Ventures, and Rogue Women. The company is now permanently closed: its
  clutchwallet.xyz domain is parked and it exposed no public production API. It
  remains in the API Evangelist network as a portfolio-lead profile; its
  clutch-wallet GitHub organization (mostly forks of Zerion, Argent, and
  MetaMask projects) and one first-party npm library survive as artifacts.
